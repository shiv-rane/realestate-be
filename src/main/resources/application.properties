# ====================================================
# Application & Server
# ====================================================
spring.application.name=real-estate-marketplace
server.port=${PORT:8080}

# ====================================================
# Database
# ====================================================
spring.datasource.url=${MYSQL_PUBLIC_URL:jdbc:mysql://localhost:3306/realestate_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================================
# JPA / Hibernate
# ====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ====================================================
# JWT Configuration
# ====================================================
# IMPORTANT: Replace with a strong Base64-encoded secret (min 256-bit / 32 chars)
app.jwt.secret=${JWT_SECRET:YmFzZTY0X3NlY3JldF9rZXlfZm9yX3JlYWxlc3RhdGVfbWFya2V0cGxhY2VfcGhhc2UxX2p3dA==}
# Token expiry in milliseconds (24 hours)
app.jwt.expiration-ms=86400000

# ====================================================
# OTP Configuration
# ====================================================
# OTP validity in minutes
app.otp.expiry-minutes=10

# ====================================================
# SpringDoc / Swagger UI
# ====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ====================================================
# Logging
# ====================================================
logging.level.com.realestate.app=DEBUG
logging.level.org.springframework.security=INFO

# ====================================================
# Email (Resend HTTPS API - Port 443)
# ====================================================
app.mail.from-name=${MAIL_FROM_NAME:Bhoomi Setu}
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:noreply@bhoomiisetu.in}

# ====================================================
# Admin Configuration
# ====================================================
app.admin.email=${ADMIN_EMAIL:bhoomiisetu@gmail.com}
