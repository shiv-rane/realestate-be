# ====================================================
# Application
# ====================================================
spring.application.name=real-estate-marketplace

# ====================================================
# Database - MySQL 8.x
# ====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/realestate_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================================
# JPA / Hibernate
# ====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ====================================================
# JWT Configuration
# ====================================================
# IMPORTANT: Replace with a strong Base64-encoded secret (min 256-bit / 32 chars)
app.jwt.secret=YmFzZTY0X3NlY3JldF9rZXlfZm9yX3JlYWxlc3RhdGVfbWFya2V0cGxhY2VfcGhhc2UxX2p3dA==
# Token expiry in milliseconds (24 hours)
app.jwt.expiration-ms=86400000

# ====================================================
# OTP Configuration
# ====================================================
# OTP validity in minutes
app.otp.expiry-minutes=10

# ====================================================
# SpringDoc / Swagger UI
# ====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ====================================================
# Logging
# ====================================================
logging.level.com.realestate.app=DEBUG
logging.level.org.springframework.security=INFO

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
